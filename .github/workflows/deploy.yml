name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect-blog-changes:
    name: Detect blog content changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      files: ${{ steps.detect.outputs.files }}
    steps:
      - name: Detect src/content/blog changes
        id: detect
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const blogPrefix = "src/content/blog/";
          const event = process.env.GITHUB_EVENT_PATH
            ? JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"))
            : {};
          const files = new Set();

          function addBlogFile(files, filePath) {
            if (typeof filePath === "string" && filePath.startsWith(blogPrefix)) {
              files.add(filePath);
            }
          }

          function addCommitFiles(files, commit) {
            for (const key of ["added", "modified", "removed"]) {
              for (const filePath of commit?.[key] ?? []) {
                addBlogFile(files, filePath);
              }
            }
          }

          async function addCompareFiles(files, event) {
            const before = event.before;
            const after = event.after ?? process.env.GITHUB_SHA;
            const repository = process.env.GITHUB_REPOSITORY;

            if (!before || !after || !repository || /^0+$/.test(before) || before === after) {
              return;
            }

            const apiUrl = process.env.GITHUB_API_URL ?? "https://api.github.com";
            const token = process.env.GITHUB_TOKEN;
            const response = await fetch(`${apiUrl}/repos/${repository}/compare/${before}...${after}`, {
              headers: {
                Accept: "application/vnd.github+json",
                ...(token ? { Authorization: `Bearer ${token}` } : {})
              }
            });

            if (!response.ok) {
              console.warn(`GitHub compare API로 변경 파일을 확인하지 못했습니다: ${response.status}`);
              return;
            }

            const compare = await response.json();
            for (const file of compare.files ?? []) {
              addBlogFile(files, file.filename);
            }
          }

          if (
            process.env.GITHUB_EVENT_NAME === "push" &&
            process.env.GITHUB_REF === "refs/heads/main"
          ) {
            for (const commit of event.commits ?? []) {
              addCommitFiles(files, commit);
            }

            addCommitFiles(files, event.head_commit);

            if (files.size === 0) {
              await addCompareFiles(files, event);
            }
          }

          const sortedFiles = [...files].sort();
          const delimiter = `BLOG_FILES_${Date.now()}`;
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `changed=${sortedFiles.length > 0}`,
              `files<<${delimiter}`,
              ...sortedFiles,
              delimiter,
              ""
            ].join("\n")
          );

          if (sortedFiles.length > 0) {
            console.log(`src/content/blog 변경 파일 ${sortedFiles.length}개를 감지했습니다.`);
            for (const file of sortedFiles) {
              console.log(`- ${file}`);
            }
          } else {
            console.log("src/content/blog 변경 파일이 없어 Discord 게시글 배포 알림을 생략합니다.");
          }
          NODE
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.deploy_meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check content
        run: npm run content:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Fetch GitHub contributions
        run: npm run github:contributions
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GITHUB_CONTRIBUTIONS_USERNAME: guseoh

      - name: Build with Astro
        run: npm run build

      - name: Write deploy metadata
        id: deploy_meta
        shell: bash
        run: |
          npm run deploy:meta
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Checkout smoke test scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node for smoke test
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Smoke test deployed site
        run: npm run smoke
        env:
          SMOKE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          SMOKE_EXPECTED_SHA: ${{ needs.build.outputs.sha }}
          SMOKE_RETRIES: 8
          SMOKE_RETRY_DELAY_MS: 10000

  notify-blog-deploy:
    name: Notify blog deployment
    needs:
      - detect-blog-changes
      - build
      - deploy
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-blog-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout notification script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node for notification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Notify Discord
        continue-on-error: true
        run: node scripts/notify-discord.mjs
        env:
          DISCORD_NOTIFICATION_KIND: blog-deploy
          BLOG_DISCORD_WEBHOOK_URL: ${{ secrets.BLOG_DISCORD_WEBHOOK_URL }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: main
          SERVER_URL: ${{ github.server_url }}
          SITE_URL: https://guseoh.github.io/

          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_BLOG_URL: ${{ needs.deploy.outputs.page_url }}
          BLOG_CHANGED_FILES: ${{ needs.detect-blog-changes.outputs.files }}

          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
