name: Normalize content metadata

on:
  push:
    branches:
      - agent/hide-project-posts-metadata

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/hide-project-posts-metadata
          fetch-depth: 0

      - name: Normalize posts and hide project drafts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          content_root = Path("src/content/blog")
          hidden_paths = {
              "src/content/blog/Network/restApi.md",
              "src/content/blog/Board/React01.md",
              "src/content/blog/Board/spring-delete-policy.md",
              "src/content/blog/actuator.md",
          }
          prefix_pattern = re.compile(r"^\[(?:Java|Spring|OS|Board|DB|Network|Infra|Git)\]\s*")
          top_level_pattern = re.compile(r"^([A-Za-z][\w-]*):(?:\s*(.*))?$")
          canonical_order = [
              "title", "description", "date", "updated", "lastVerified",
              "slug", "aliases", "commentKey", "category", "tags",
              "testedWith", "book", "series", "chapter", "seriesOrder",
              "heroImage", "draft",
          ]
          quoted_scalar_keys = {
              "title", "description", "slug", "commentKey", "category",
              "book", "series", "heroImage",
          }

          def scalar_value(raw):
              value = raw.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
                  return value[1:-1]
              return value

          def split_blocks(frontmatter):
              lines = frontmatter.splitlines()
              blocks = {}
              original_order = []
              index = 0
              while index < len(lines):
                  match = top_level_pattern.match(lines[index])
                  if not match:
                      index += 1
                      continue
                  key = match.group(1)
                  block = [lines[index]]
                  index += 1
                  while index < len(lines) and not top_level_pattern.match(lines[index]):
                      block.append(lines[index])
                      index += 1
                  blocks[key] = block
                  original_order.append(key)
              return blocks, original_order

          def normalize_block(key, block, path):
              first = block[0]
              raw = first.split(":", 1)[1].strip()

              if key == "title":
                  title = prefix_pattern.sub("", scalar_value(raw)).strip()
                  return [f"title: {json.dumps(title, ensure_ascii=False)}"]

              if key in quoted_scalar_keys:
                  return [f"{key}: {json.dumps(scalar_value(raw), ensure_ascii=False)}"]

              if key == "tags":
                  items = []
                  for line in block[1:]:
                      item = re.match(r"^\s*-\s*(.+?)\s*$", line)
                      if item:
                          items.append(item.group(1))
                  return ["tags:", *[f"    - {item}" for item in items]]

              if key == "testedWith" and raw == "":
                  nested = []
                  for line in block[1:]:
                      if not line.strip():
                          continue
                      nested.append(f"    {line.strip()}")
                  return ["testedWith:", *nested]

              if key == "draft":
                  value = "true" if path in hidden_paths else raw.lower()
                  return [f"draft: {value}"]

              return block

          for file in sorted(content_root.rglob("*.md")):
              if file.name.startswith("_"):
                  continue
              path = file.as_posix()
              source = file.read_text(encoding="utf-8")
              match = re.match(r"^---\r?\n([\s\S]*?)\r?\n---\r?\n?", source)
              if not match:
                  continue

              blocks, original_order = split_blocks(match.group(1))
              if "aliases" not in blocks:
                  blocks["aliases"] = ["aliases: []"]
              if "heroImage" not in blocks:
                  blocks["heroImage"] = ['heroImage: "/og-image.svg"']
              if path in hidden_paths:
                  blocks["draft"] = ["draft: true"]

              ordered_keys = [key for key in canonical_order if key in blocks]
              ordered_keys.extend(key for key in original_order if key not in ordered_keys)
              ordered_keys.extend(key for key in blocks if key not in ordered_keys)

              frontmatter_lines = []
              for key in ordered_keys:
                  frontmatter_lines.extend(normalize_block(key, blocks[key], path))

              body = source[match.end():]
              normalized = "---\n" + "\n".join(frontmatter_lines) + "\n---\n\n" + body.lstrip("\r\n")
              file.write_text(normalized, encoding="utf-8")

          series_path = Path("src/data/series.json")
          series = json.loads(series_path.read_text(encoding="utf-8"))
          hidden_series = {
              "board-프로젝트-개선-기록",
              "board-프로젝트-성능-개선",
              "thymeleaf-게시판을-react로-전환",
          }
          for item in series:
              if item.get("id") in hidden_series:
                  item["status"] = "planned"
                  item["featured"] = False
          series_path.write_text(json.dumps(series, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          navigation_path = Path("src/data/navigation.json")
          navigation = json.loads(navigation_path.read_text(encoding="utf-8"))
          hidden_navigation_slugs = {
              "board", "performance", "monitoring", "board-프로젝트-개선-기록"
          }
          for group in navigation:
              for item in group.get("items", []):
                  if item.get("slug") in hidden_navigation_slugs:
                      item["planned"] = True
          navigation_path.write_text(json.dumps(navigation, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          style_path = Path("scripts/content-style-rules.mjs")
          style = style_path.read_text(encoding="utf-8")
          if "titlePrefixPattern" not in style:
              style = style.replace(
                  'const forwardLookingPattern = /(다음 글에서|다음 글로|다음번에|뒤의 글에서|이후 글에서|후속 글에서)/;',
                  'const forwardLookingPattern = /(다음 글에서|다음 글로|다음번에|뒤의 글에서|이후 글에서|후속 글에서)/;\nconst titlePrefixPattern = /^\\[(Java|Spring|OS|Board|DB|Network|Infra|Git)\\]\\s*/;'
              )
              style = style.replace(
                  '  checkTagIndentation(lines, frontmatterEnd, issues);',
                  '  checkTagIndentation(lines, frontmatterEnd, issues);\n  checkTitlePrefix(lines, frontmatterEnd, issues);'
              )
              marker = 'function checkTagIndentation(lines, frontmatterEnd, issues) {'
              function_text = '''function checkTitlePrefix(lines, frontmatterEnd, issues) {\n  const title = readFrontmatterScalar(lines, frontmatterEnd, "title");\n  if (titlePrefixPattern.test(title)) {\n    issues.push(issue(2, "title-prefix", "제목에는 카테고리 접두사를 사용하지 않습니다."));\n  }\n}\n\n'''
              style = style.replace(marker, function_text + marker)
              style_path.write_text(style, encoding="utf-8")

          workflow = Path(".github/workflows/normalize-content-metadata.yml")
          workflow.unlink()
          PY

      - name: Commit normalized content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 게시글 공개 상태와 메타데이터 통일"
          git push origin HEAD:agent/hide-project-posts-metadata
