name: Finalize metadata cleanup

on:
  push:
    branches:
      - agent/hide-project-posts-metadata
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/hide-project-posts-metadata
          fetch-depth: 0

      - name: Apply final cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          actuator_path = Path("src/content/blog/actuator.md")
          actuator = actuator_path.read_text(encoding="utf-8")
          actuator = actuator.replace(
              'title: "[Board 프로젝트] 게시글 상세 조회 성능 측정 - 개선 전 분석"',
              'title: "게시글 상세 조회 성능 측정 - 개선 전 분석"',
              1,
          )
          actuator_path.write_text(actuator, encoding="utf-8")

          style_path = Path("scripts/content-style-rules.mjs")
          style = style_path.read_text(encoding="utf-8")
          style = style.replace(
              'const titlePrefixPattern = /^\\[(Java|Spring|OS|Board|DB|Network|Infra|Git)\\]\\s*/;',
              'const titlePrefixPattern = /^\\[[^\\]]+\\]\\s*/;',
              1,
          )
          style_path.write_text(style, encoding="utf-8")
          PY

          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          rm -f .github/workflows/diagnose-content-check.yml
          rm -f .github/workflows/finalize-metadata-cleanup.yml

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: 게시글 숨김과 메타데이터 통일 마무리"
          git push origin HEAD:agent/hide-project-posts-metadata
