name: Update GitHub Activity

on:
  schedule:
    # Every day at 00:10 KST.
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: update-github-activity
  cancel-in-progress: false

jobs:
  update-github-activity:
    name: Update GitHub Activity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub contributions
        id: fetch_activity
        run: npm run github:contributions
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GITHUB_CONTRIBUTIONS_USERNAME: guseoh

      - name: Request daily Pages deployment
        id: deploy_activity
        if: contains(fromJSON('["success", "fallback"]'), steps.fetch_activity.outputs.status)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "run_id=" >> "$GITHUB_OUTPUT"
          echo "run_url=" >> "$GITHUB_OUTPUT"
          echo "head_sha=" >> "$GITHUB_OUTPUT"

          # Never commit, push or bypass branch protection.
          previous_run_id="$(gh run list \
            --workflow deploy.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')"

          gh workflow run deploy.yml --ref main

          for attempt in {1..12}; do
            run_id="$(gh run list \
              --workflow deploy.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId \
              --jq ".[].databaseId | select(. > $previous_run_id)" \
              | head -n 1)"

            if [ -n "$run_id" ]; then
              run_sha="$(gh run view "$run_id" --json headSha --jq '.headSha')"
              run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
              echo "head_sha=$run_sha" >> "$GITHUB_OUTPUT"
              echo "Daily Pages deployment requested: $run_url (SHA $run_sha)."
              exit 0
            fi

            echo "Waiting for the newly dispatched deployment run ($attempt/12)."
            sleep 5
          done

          echo "::error::Could not find the newly dispatched deployment run."
          exit 1

      - name: Write activity refresh summary
        if: always()
        shell: bash
        env:
          REFRESH_STATUS: ${{ steps.fetch_activity.outputs.status || 'unknown' }}
          REFRESH_SOURCE: ${{ steps.fetch_activity.outputs.source || 'unknown' }}
          REFRESH_DETAIL: ${{ steps.fetch_activity.outputs.detail }}
          DATA_CHANGED: ${{ steps.fetch_activity.outputs.changed || 'false' }}
          DEPLOY_OUTCOME: ${{ steps.deploy_activity.outcome || 'skipped' }}
          DEPLOY_RUN_ID: ${{ steps.deploy_activity.outputs.run_id }}
          DEPLOY_RUN_URL: ${{ steps.deploy_activity.outputs.run_url }}
          DEPLOY_HEAD_SHA: ${{ steps.deploy_activity.outputs.head_sha }}
        run: |
          {
            echo "## GitHub Activity 갱신 결과"
            echo
            echo "| 항목 | 결과 |"
            echo "| --- | --- |"
            echo "| 실행 시각 | $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST') |"
            echo "| 수집 상태 | $REFRESH_STATUS |"
            echo "| 데이터 출처 | $REFRESH_SOURCE |"
            echo "| 데이터 변경 감지 | $DATA_CHANGED |"
            echo "| main 자동 커밋 | 없음 (배포 빌드에서 데이터 생성) |"
            echo "| 배포 요청 | $DEPLOY_OUTCOME |"
            if [ -n "$DEPLOY_RUN_ID" ]; then
              echo "| 배포 실행 ID | $DEPLOY_RUN_ID |"
              echo "| 배포 대상 SHA | $DEPLOY_HEAD_SHA |"
            fi
            echo
            echo "- [현재 워크플로 실행](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            if [ -n "$DEPLOY_RUN_URL" ]; then
              echo "- [배포 워크플로 실행]($DEPLOY_RUN_URL)"
            fi
            if [ -n "$REFRESH_DETAIL" ]; then
              echo
              echo "### 상세 내용"
              echo
              echo "$REFRESH_DETAIL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        if: always()
        continue-on-error: true
        run: node scripts/notify-discord.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTIVITY_DEPLOY_MODE: build
          REPOSITORY: ${{ github.repository }}
          BRANCH: main
          SERVER_URL: ${{ github.server_url }}
          REFRESH_STATUS: ${{ steps.fetch_activity.outputs.status || 'unknown' }}
          REFRESH_SOURCE: ${{ steps.fetch_activity.outputs.source || 'unknown' }}
          REFRESH_DETAIL: ${{ steps.fetch_activity.outputs.detail }}
          DATA_CHANGED: ${{ steps.fetch_activity.outputs.changed || 'false' }}
          DEPLOY_OUTCOME: ${{ steps.deploy_activity.outcome || 'skipped' }}
          DEPLOY_RUN_ID: ${{ steps.deploy_activity.outputs.run_id }}
          DEPLOY_RUN_URL: ${{ steps.deploy_activity.outputs.run_url }}
          DEPLOY_HEAD_SHA: ${{ steps.deploy_activity.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail degraded refresh or deploy request
        if: >-
          always() &&
          (
            steps.fetch_activity.outputs.status == 'degraded' ||
            steps.deploy_activity.outcome == 'failure'
          )
        shell: bash
        run: |
          echo "::error::GitHub Activity refresh or Pages dispatch failed."
          exit 1
