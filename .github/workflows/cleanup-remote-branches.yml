name: Cleanup remote branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-remote-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote --heads origin \
            | awk '{sub("refs/heads/", "", $2); print $2}' \
            | while IFS= read -r branch; do
                if [ "$branch" != "main" ]; then
                  echo "Deleting $branch"
                  git push origin --delete "$branch"
                fi
              done

          echo "Remaining remote branches:"
          git ls-remote --heads origin
