name: Build clean metadata branch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  build-clean-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/hide-project-posts-metadata
          fetch-depth: 0

      - name: Create clean branch from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --binary origin/main...HEAD -- . ':(exclude).github/workflows/**' > /tmp/metadata-cleanup.patch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B agent/hide-project-posts-metadata-clean origin/main
          git apply --index /tmp/metadata-cleanup.patch
          git commit -m "docs: 프로젝트 글 숨김과 메타데이터 통일"
          git push --force origin HEAD:agent/hide-project-posts-metadata-clean
