name: Cleanup legacy branches

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/legacy-content-cleanup-1" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/legacy-content-cleanup-2" || true
