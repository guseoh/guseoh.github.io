name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Collect changed content files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}"...HEAD \
            -- src/content/blog > /tmp/changed-content-files.txt

      - name: Diagnose content
        env:
          CONTENT_CHECK_CHANGED_FILES_FILE: /tmp/changed-content-files.txt
        run: |
          node scripts/check-content.mjs
          node scripts/check-content-style.mjs
