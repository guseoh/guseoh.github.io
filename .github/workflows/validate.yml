name: Validate

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/v2-audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/v2-audit-production.json" || true
          node scripts/audit-dependencies.mjs "$RUNNER_TEMP/v2-audit-all.json" "$RUNNER_TEMP/v2-audit-production.json"

      - name: Observe GitHub Pages security headers
        run: node scripts/audit-hosting.mjs

      - name: Collect changed content files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}"...HEAD \
            -- src/content/blog > /tmp/changed-content-files.txt

      - name: Check content
        env:
          CONTENT_CHECK_CHANGED_FILES_FILE: ${{ github.event_name == 'pull_request' && '/tmp/changed-content-files.txt' || '' }}
        run: npm run content:check

      - name: Type-check Astro
        run: npm run check

      - name: Syntax-check JavaScript tooling and plugins
        run: npm run scripts:check

      - name: Run tests
        run: npm test

      - name: Build and inspect published cache policy
        env:
          AUDIT_LIVE_CACHE: "1"
        run: npm run build

      - name: Install Chromium for browser quality checks
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility checks
        run: npm run test:e2e

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-review-${{ github.run_id }}
          path: test-results/ui-review/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Report Lighthouse lab timings
        run: node scripts/audit-lighthouse.mjs

      - name: Smoke test local preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4322 > /tmp/astro-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:4322/" > /dev/null; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/astro-preview.log
            exit 1
          fi

          SMOKE_BASE_URL="http://127.0.0.1:4322" npm run smoke
