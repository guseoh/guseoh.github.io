name: G7 Temporary Dependency Remediation

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/v2-g7-lock-remediation.yml"

permissions:
  contents: write

jobs:
  security-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Prepare a security-only package-lock update
        shell: bash
        run: |
          npm ci
          npm pkg set 'dependencies.sharp=^0.35.5'
          # Lockfile regeneration only; package installation is npm ci.
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --omit=dev --package-lock-only --ignore-scripts || true
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run content:check
          npm run check
          npm test
          npm run build

      - name: Verify change scope and commit only dependency files
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -v -E '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files: $unexpected"
            exit 1
          fi
          git add -- package.json package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: G7 운영 의존성 High 취약점 패치"
          git push origin HEAD:dev
