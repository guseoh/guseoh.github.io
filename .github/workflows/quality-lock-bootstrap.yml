name: Bootstrap quality test lockfile (one-time)

on:
  push:
    branches:
      - refactor/blog-tech-debt
    paths:
      - .github/workflows/quality-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'guseoh/guseoh.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/blog-tech-debt
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Create reproducible quality dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact \
            @playwright/test@1.61.1 @axe-core/playwright@4.12.1 @lhci/cli@0.15.1
          npm ci
          npm run content:check
          npm run check
          npm test
          npm run build
      - name: Commit lockfile and remove one-time bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/quality-lock-bootstrap.yml
          git add package.json package-lock.json .github/workflows/quality-lock-bootstrap.yml
          git diff --cached --check
          git commit -m "build: 품질 검사 의존성과 잠금 파일 고정"
          git push origin HEAD:refactor/blog-tech-debt
